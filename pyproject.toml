[project]
name = "stock-analyze-workspace"
version = "0.1.0"
description = "个人交易复盘平台（backend uv workspace root）"
requires-python = ">=3.12"
# 工作区聚合：根项目依赖全部成员，`uv sync` 即安装整套后端
dependencies = [
    "stock-contracts",
    "stock-core",
    "stock-platform",
    "stock-ledger",
    "stock-review",
    "stock-delivery",
    "stock-api",
    "stock-worker",
]

# ── 可选依赖：真实行情源（MARKET_MODE=live 才需要）────────────
# 根为 workspace 聚合（package=false），转发到真正的实现包 stock-platform。
[project.optional-dependencies]
live = ["stock-platform[live]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/packages/*", "backend/services/*"]

[tool.uv.sources]
stock-contracts = { workspace = true }
stock-core = { workspace = true }
stock-platform = { workspace = true }
stock-ledger = { workspace = true }
stock-review = { workspace = true }
stock-delivery = { workspace = true }
stock-api = { workspace = true }
stock-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml",
    "mutmut>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "api: API 验收用例（携带 API-NNN 标识）",
    "integration: 需要真实 PostgreSQL",
    "isolation: 多租户越权用例",
    "live: 需要网络与 akshare optional extra 的联网用例（默认门禁排除）",
    "golden: 指标黄金用例（L1，三方比对；零 skip/xfail 容差）",
    "perf: 性能预算用例（PR-full 告警，release 超 2× 阻断）",
]
filterwarnings = ["error::DeprecationWarning:stock_api.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/packages", "backend/services", "backend/tests"]
exclude = ["AGENTS.md", "docs/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF",
]
ignore = [
    # 中文文档注释中的全角标点是有意为之
    "RUF001", "RUF002", "RUF003",
    # pydantic Field(...) 作为默认值是框架惯用法
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/"]

[[tool.mypy.overrides]]
module = ["stock_ledger.infrastructure.parsers.*"]
disallow_untyped_calls = false

# akshare/pandas 未发布 py.typed：optional extra 未安装时也必须能通过 mypy strict。
[[tool.mypy.overrides]]
module = ["akshare", "akshare.*", "pandas", "pandas.*"]
ignore_missing_imports = true

# ── 变异测试（Period2-07 §8.9 / D-16）────────────────────────
# pin mutmut>=3.2,<4（当前锁定 3.8.0；3.x 键名与 2.x 不同——source_paths /
# pytest_add_cli_args_test_selection，以 mutmut 3.8 configuration.py 为准）。
# 布局：mutmut 3.8 硬性要求「文件路径推导的模块名 == 运行时 import 名」，
# 且 setup_source_paths 只认 mutants/{.,src,source} 三种根；monorepo 的
# backend/packages/core/src/stock_core 两种机制都不兼容。故由 Makefile 在仓库根
# 建软链 stock_core -> backend/packages/core/src/stock_core（已 gitignore），
# mutmut 经软链把包复制为 mutants/stock_core/——mutants/. 入 sys.path 后
# `import stock_core` 即命中变异副本，路径推导名 stock_core.* 与之一致。
# 变异范围用 only_mutate 收窄到 §8.9 规定的 metrics/** 与 stats/**
# （fnmatch 的 * 可跨 /，含子目录）。
# pytest 在 mutants/ 目录下执行，故 also_copy 必须把测试目录/夹具/conftest 一并
# 复制进去；pyproject.toml 复制用于锚定 rootdir 与 pythonpath。
[tool.mutmut]
source_paths = ["stock_core"]
only_mutate = [
    "stock_core/metrics/*",
    "stock_core/stats/*",
]
pytest_add_cli_args_test_selection = ["backend/tests/unit/core", "backend/tests/golden"]
pytest_add_cli_args = ["-x", "-q", "-p", "no:cacheprovider"]
also_copy = [
    "pyproject.toml",
    "backend/tests",
]

[tool.importlinter]
root_packages = ["stock_contracts", "stock_core", "stock_platform", "stock_ledger", "stock_review", "stock_delivery", "stock_api", "stock_worker"]
include_external_packages = true

# ── 分层依赖铁律 L1~L5（Architecture §2.3）────────────────────
# 下层绝不可依赖上层；stock_api / stock_worker 为顶层，可依赖全部。

[[tool.importlinter.contracts]]
name = "L1 stock_contracts 不依赖任何其它包"
type = "forbidden"
source_modules = ["stock_contracts"]
forbidden_modules = ["stock_core", "stock_platform", "stock_ledger", "stock_review", "stock_delivery", "stock_api", "stock_worker"]

[[tool.importlinter.contracts]]
name = "L2 stock_core 只依赖 stock_contracts"
type = "forbidden"
source_modules = ["stock_core"]
forbidden_modules = ["stock_platform", "stock_ledger", "stock_review", "stock_delivery", "stock_api", "stock_worker"]

[[tool.importlinter.contracts]]
name = "L3 stock_platform 只依赖 stock_contracts / stock_core"
type = "forbidden"
source_modules = ["stock_platform"]
forbidden_modules = ["stock_ledger", "stock_review", "stock_delivery", "stock_api", "stock_worker"]

[[tool.importlinter.contracts]]
name = "L4 stock_ledger 只依赖 stock_contracts / stock_core / stock_platform"
type = "forbidden"
source_modules = ["stock_ledger"]
forbidden_modules = ["stock_review", "stock_delivery", "stock_api", "stock_worker"]

[[tool.importlinter.contracts]]
name = "L5 api/worker 为顶层：任何下层不得依赖它们"
type = "forbidden"
source_modules = ["stock_contracts", "stock_core", "stock_platform", "stock_ledger", "stock_review", "stock_delivery"]
forbidden_modules = ["stock_api", "stock_worker"]
