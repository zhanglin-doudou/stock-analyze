[project]
name = "stock-worker"
version = "0.1.0"
description = "任务消费者入口（与 api 同代码库的第二个部署单元）"
requires-python = ">=3.12"
dependencies = [
    "stock-contracts",
    "stock-core",
    "stock-platform",
    "stock-ledger",
    "stock-review",
    "stock-delivery",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_worker"]
