[project]
name = "stock-api"
version = "0.1.0"
description = "FastAPI 接入层：routers / middlewares / deps / errors"
requires-python = ">=3.12"
dependencies = [
    "stock-contracts",
    "stock-core",
    "stock-platform",
    "stock-ledger",
    "stock-review",
    "stock-delivery",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_api"]
