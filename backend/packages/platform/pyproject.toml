[project]
name = "stock-platform"
version = "0.1.0"
description = "横切能力：配置、认证、租户上下文、队列、outbox、观测、备份"
requires-python = ">=3.12"
dependencies = [
    "stock-contracts",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_platform"]
