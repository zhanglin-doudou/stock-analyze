[project]
name = "stock-ledger"
version = "0.1.0"
description = "数据底座上下文：导入两阶段、去重、分类、软删、对账"
requires-python = ">=3.12"
dependencies = [
    "stock-contracts",
    "stock-core",
    "stock-platform",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_ledger"]
