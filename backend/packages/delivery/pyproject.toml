[project]
name = "stock-delivery"
version = "0.1.0"
description = "交付层上下文：报告区块、对话编排、导出包"
requires-python = ">=3.12"
dependencies = [
    "json-repair>=0.30,<1",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "stock-contracts",
    "stock-platform",
    "tiktoken>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_delivery"]
