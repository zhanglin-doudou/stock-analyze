[project]
name = "stock-delivery"
version = "0.1.0"
description = "交付层上下文：报告区块、对话编排、导出包"
requires-python = ">=3.12"
dependencies = ["stock-contracts", "stock-platform"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_delivery"]
