# 生产编排：宿主 Caddy（TLS/入口）+ web + api×N + worker + migrate
# web 容器内 nginx 是栈内唯一前端入口：静态 SPA + /api 与探针反代 → api:8000。
# TLS/域名/证书由宿主 Caddy 负责（示例见 infra/caddy/Caddyfile.example），
# 不再在编排内跑网关容器；web 端口只绑 127.0.0.1，公网 80/443 归 Caddy。
# 数据库由云主机 PostgreSQL:5432 提供，不在本编排内（见 docs/DEPLOYMENT.md P0-4）。
#
#   cp infra/.env.prod.example infra/.env.prod   # 填写密钥（勿提交）
#   docker compose --env-file infra/.env.prod -f infra/compose/docker-compose.prod.yml up -d --build
#   docker compose ... up -d --scale api=2       # 扩副本（nginx 经 Docker DNS 自动发现）
#
# 本地全套预演（HTTP 直连，无 Caddy）：追加 -f infra/compose/docker-compose.local.yml
name: stock-analyze

x-app: &app
  image: stock-analyze/api:${TAG:-local}
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.api
  env_file:
    - ../.env.prod
  extra_hosts:
    # 数据库与应用同机部署时可用 STOCK_DB_HOST=host.docker.internal
    # （Linux 宿主机也生效；Docker Desktop 自带该域名）
    - "host.docker.internal:host-gateway"
  networks:
    - sa-net
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  web:
    image: stock-analyze/web:${TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      # 只绑本机回环：宿主 Caddy 反代到 127.0.0.1:8002（见 infra/caddy/Caddyfile.example）
      - "127.0.0.1:8002:80"
    networks:
      - sa-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    # 数据库在编排外（云主机 5432）：无法依赖 db 健康检查，直接连 STOCK_DB_HOST

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2.0
    # 不发布宿主端口：只经 web 内 nginx 反代访问（/metrics、/docs 公网不可达）
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2.0
    # worker 手里可能有长任务：给足优雅退出时间，避免租约到期前被杀
    stop_grace_period: 60s

  # db 不在编排内：生产数据库由云主机 PostgreSQL:5432 提供。
  # 角色初始化用 infra/postgres/init-prod/00-bootstrap.sh 在云主机上手工执行（幂等）。

networks:
  sa-net:
    name: sa-net
    # 固定网段：与 TRUSTED_PROXY_CIDRS 对齐，避免 Docker 自动分配落在信任区间外
    ipam:
      config:
        - subnet: 172.28.0.0/16
