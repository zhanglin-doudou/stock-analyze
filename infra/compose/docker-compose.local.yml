# 本地全套预演：与 prod 同栈直连 HTTP（TLS 由宿主 Caddy 负责，本地不跑 Caddy）。
#
#   docker compose --env-file infra/.env.prod \
#     -f infra/compose/docker-compose.prod.yml \
#     -f infra/compose/docker-compose.local.yml up -d --build
#
# 用途：验证镜像、迁移、探针、路由、SSE；访问 http://localhost（或 http://127.0.0.1:8002）。
# TLS/证书必须在上云后验证（DEPLOYMENT.md §4）。
services:
  web:
    ports:
      # 与 prod 的 127.0.0.1:8002 并存（同一容器端口可映射多个宿主端口）
      - "127.0.0.1:80:80"
