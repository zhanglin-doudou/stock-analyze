# nginx 安全响应头（原 Traefik security-headers 中间件口径，迁移 2026-11-23）。
# 注意 nginx 的 add_header 继承规则：任何一级只要声明了 add_header 就不再继承上层，
# 因此在 server 级 include 之后，声明了 Cache-Control 的 location 里必须再次 include。
# 前端为 Vite SPA：Tailwind/Radix 使用内联 style，故 style-src 放行 'unsafe-inline'；
# index.html 里的首屏主题预置脚本（见 index.html 内联 <script>）的 sha256 散列固定，
# 通过 hash 放行而非 'unsafe-inline'——若修改该脚本必须同步更新下方散列。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CdaIpVwyQq3XdZCT4uynldGMgHt5EKYPB3YPHye/5vU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# TLS 由宿主 Caddy 终止；HSTS 在 HTTP 预演下会被浏览器忽略，可安全常开
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
