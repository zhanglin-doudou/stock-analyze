server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # 运维端点公网不可达：显式 404，避免 SPA fallback 返回 200 HTML 造成“假可达”
    location = /metrics {
        return 404;
    }

    # 生产已关闭的文档入口（STOCK_ENV=prod 时 FastAPI 不注册）：同样显式 404
    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    # Vite 构建产物带内容 hash：长缓存 + immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA history fallback；入口 HTML 不缓存，保证发版即生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
