# web 容器内 nginx = 栈内唯一前端入口（2026-11-23 起，网关由宿主 Caddy 承担）：
#   - 静态 SPA（Vite 构建产物）
#   - /api/ 与根路径探针反代 → api:8000（SSE 安全、按来源 IP 粗限流）
# 宿主 Caddy 只做 TLS 与入口（见 infra/caddy/Caddyfile.example），不再双层网关。

# ── 真实客户端 IP ─────────────────────────────────────────
# 唯一直连来源是宿主 Caddy（web 端口只绑 127.0.0.1）；信任其 X-Real-IP 头，
# 把 $remote_addr 还原为真实客户端，供下方限流与后端使用。
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;   # Docker 网络（compose 固定网段 172.28.0.0/16）
real_ip_header X-Real-IP;
real_ip_recursive on;

# ── 网关粗限流（按来源 IP，防突发/扫描；原 Traefik ratelimit 口径）──
# 按用户/令牌的细限流属应用层（Period3-09），此处只做网关级保护。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/s;

# X-Forwarded-Proto：Caddy 传入优先，本地直连时回退 $scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # 运维端点公网不可达：显式 404，避免 SPA fallback 返回 200 HTML 造成“假可达”
    location = /metrics {
        return 404;
    }

    # 生产已关闭的文档入口（STOCK_ENV=prod 时 FastAPI 不注册）：同样显式 404
    location = /docs {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    # ── API 反代（/api/ 与普通 SSE 同路径，无法按路径区分，整体关闭缓冲）──
    location /api/ {
        limit_req zone=api_limit burst=240 nodelay;
        # resolver + 变量 proxy_pass：api 副本变化 10s 内自动发现（支持 --scale api=N）
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_origin http://api:8000;
        proxy_pass $api_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # SSE（chat / 任务进度）必须逐帧透传：不缓冲、不压缩（gzip_types 不含 event-stream）
        proxy_buffering off;
        proxy_cache off;
        # 空闲超时（非总时长）：SSE 长连接不被掐断；chat 轮次有服务端 60s deadline
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 根路径探针/版本（原 Traefik 直由 api 承接；/metrics 不在内）──
    location ~ ^/(healthz|readyz|version)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_origin http://api:8000;
        proxy_pass $api_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 10s;
    }

    # Vite 构建产物带内容 hash：长缓存 + immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # SPA history fallback；入口 HTML 不缓存，保证发版即生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # 静态 gzip（API JSON 也经此压缩；SSE 不压缩——text/event-stream 不在 gzip_types）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
